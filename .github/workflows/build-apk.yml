name: Build APK

# Runs automatically every time code is uploaded, and can also be started by hand
# from the "Actions" tab ("Run workflow").
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: WellControl-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WellControl.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WellControl.apk --title "Well Control (latest build)" --notes "Download WellControl.apk and install it on your Android phone."
